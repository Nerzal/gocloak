name: Tests
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # weekly vulnerability scan, new advisories appear without code changes
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - name: Run govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: stable
          go-package: ./...

  tests:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: [stable]
        keycloak: ["26.8.2"]
        include:
          # early warning for the next Keycloak release, does not fail the build
          - go: stable
            keycloak: nightly
            experimental: true
    continue-on-error: ${{ matrix.experimental == true }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ matrix.go }}

      - name: Run Keycloak
        env:
          KEYCLOAK_VERSION: ${{ matrix.keycloak }}
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Unit Tests
        run: |
          go test -race -cover -coverprofile=coverage.txt -covermode=atomic -p 100 -cpu 1,2 -bench . -benchmem ./... > test.log
          cat test.log

      - name: Failed Logs
        if: failure()
        run: |
          cat test.log
          docker ps
          docker compose logs keycloak

      - name: CodeCov
        if: matrix.go == 'stable' && matrix.keycloak != 'nightly'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.txt
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload Benchmark Log
        if: matrix.go == 'stable' && matrix.keycloak != 'nightly' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-log
          path: test.log

      - name: GoReportCard
        if: matrix.go == 'stable' && matrix.keycloak != 'nightly' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: curl --fail --request POST "https://goreportcard.com/checks" --data "repo=github.com/Nerzal/gocloak"

  # only job with write access, so test code from pull requests never runs with a token that can push
  benchmark:
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # benchmark results are pushed to gh-pages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: benchmark-log

      - name: Store Benchmark Result
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1
        with:
          tool: "go"
          output-file-path: test.log
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
