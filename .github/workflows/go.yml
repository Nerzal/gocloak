name: Tests
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # weekly vulnerability scan, new advisories appear without code changes
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: stable
          go-package: ./...

  tests:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write # benchmark results are pushed to gh-pages
    strategy:
      fail-fast: false
      matrix:
        go: [oldstable, stable]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      - name: Run Keycloak
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Unit Tests
        run: |
          go test -race -cover -coverprofile=coverage.txt -covermode=atomic -p 100 -cpu 1,2 -bench . -benchmem > test.log
          cat test.log

      - name: Failed Logs
        if: failure()
        run: |
          cat test.log
          docker ps
          docker compose logs keycloak

      - name: CodeCov
        if: matrix.go == 'stable'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.txt
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Store Benchmark Result
        if: matrix.go == 'stable' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: "go"
          output-file-path: test.log
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true

      - name: GoReportCard
        if: matrix.go == 'stable' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: curl --fail --request POST "https://goreportcard.com/checks" --data "repo=github.com/Nerzal/gocloak"
